<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三年二班黑板报 · 夹带坦克大战</title>
    <style>
      body {
        margin: 0;
        font-family: "Songti SC", "STSong", "SimSun", serif;
        background: #f6f0de;
        color: #2b2418;
      }
      header,
      main,
      footer {
        max-width: 820px;
        margin: 0 auto;
        padding: 20px 16px;
      }
      header {
        border-bottom: 3px solid #c75b3a;
      }
      h1 {
        margin: 0 0 6px;
      }
      .card {
        background: #fffdf6;
        padding: 12px;
        border: 1px solid #d8c38a;
        border-radius: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>三年二班黑板报</h1>
      <p>这是一个「其他网站」示例：把校园坦克大战夹在文章中间。</p>
    </header>
    <main>
      <p>本周主题：白色坦克就是老师本人。下面这局课直接嵌在黑板报里，不用跳走。</p>
      <div class="card">
        <iframe
          src="../embed.html"
          title="校园坦克大战"
          width="680"
          height="920"
          style="border: 0; width: 100%; max-width: 680px; height: 920px; background: #16201b"
          allow="autoplay"
        ></iframe>
      </div>
      <p>也可以只放一行脚本：</p>
      <pre>&lt;script src="../js/widget.js" data-width="680" data-height="920"&gt;&lt;/script&gt;</pre>
    </main>
    <footer>示例页，用来演示如何把游戏夹进别的网站。</footer>
  </body>
</html>
